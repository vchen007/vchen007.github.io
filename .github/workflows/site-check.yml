name: Site check

# Builds the site the way GitHub Pages does and checks every link, image and
# script. Internal links are checked on every push and pull request; links to
# other websites are also checked once a week (and when run by hand), since
# those break without any change here.
on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "23 15 * * 1" # Mondays, 15:23 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
          JEKYLL_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAGES_REPO_NWO: ${{ github.repository }}

      - name: Check internal links, images and scripts
        run: >
          bundle exec htmlproofer ./_site
          --disable-external
          --checks Links,Images,Scripts,Favicon,OpenGraph
          --swap-urls '^https\://vchen007\.github\.io:'

      - name: Check links to other sites
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        # LinkedIn answers automated requests with status 999, so it is skipped.
        run: >
          bundle exec htmlproofer ./_site
          --checks Links,Images,Scripts
          --swap-urls '^https\://vchen007\.github\.io:'
          --ignore-urls '/linkedin\.com/'
          --ignore-status-codes 429,999
          --enforce-https=false
